baseURL: "https://feiniaobf.github.io/yeekox-blog"
title: "Yeelight の 小屋"
defaultContentLanguage: "zh-cn"
enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: true

languages:
  zh-cn:
    label: "中文"
    locale: "zh-CN"
    weight: 1
    title: "Yeelight の 小屋"
  en:
    label: "English"
    locale: "en-US"
    weight: 2
    title: "Yeelight's Cabin"
  ja:
    label: "日本語"
    locale: "ja-JP"
    weight: 3
    title: "Yeelight の 小屋"

# ============ 主题模块（Inyo） ============
module:
  hugoVersion:
    extended: true
    min: "0.164.0"
  imports:
    - path: github.com/FeiNiaoBF/hugo-theme-inyo

# ============ Markdown / LaTeX ============
markup:
  _merge: "deep"
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ["$$", "$$"]]
          inline: [['\(', '\)']]
        enable: true

# ============ 分类法（taxonomy） ============
taxonomies:
  tag: tags
  category: categories

# ============ Inyo 主题参数 ============
params:
  font: "wenkai"
  webfonts: true
  subtitle: "清风徐来，明月入怀"
  author: "Yeelight"
  math: true

  # 首页目录只收 posts 分区；其他顶层目录可按需扩展
  mainSections: ["posts"]

  navigation:
    tags: "tags"
    about: "about"

  # 诗词 hero（默认关闭，用主题内置诗句；开启则从 API 拉取）
  heroPoetry:
    api:
      enabled: false
      endpoint: "https://poetry.palemoky.com/api/poems/random"
      lang: "zh-Hans"

  social:
    - name: "GitHub"
      url: "https://github.com/feiniaobf"
    - name: "RSS"
      url: "/index.xml"
